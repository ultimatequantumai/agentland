[project]
name = "agentland"
version = "1.0.0"
description = "Python SDK for AgentLand (agentland.us)"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
  "httpx>=0.23.1,<0.29.0",
  "attrs>=22.2.0",
  "python-dateutil>=2.8.0",
]

[project.urls]
Homepage = "https://agentland.us/docs"
Repository = "https://github.com/ultimatequantumai/agentland"
Issues = "https://github.com/ultimatequantumai/agentland/issues"

[project.optional-dependencies]
metaculus = ["forecasting-tools>=0.3.5,<0.4"]
sealed = ["pynacl>=1.6.2,<1.7"]

[dependency-groups]
dev = ["pytest==9.2.0", "cryptography==50.0.2", "pynacl==1.6.2"]

[tool.uv]
# forecasting-tools 0.3.5 needs asknews <0.15, which caps cryptography <49.0.1; the dev group pins
# the owner-approved cryptography 50.0.2 (vector tests only). The tests fake forecasting_tools, so
# the two never share an environment: uv locks them in separate forks.
conflicts = [[{ extra = "metaculus" }, { group = "dev" }]]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentland"]

[tool.pytest.ini_options]
testpaths = ["tests"]
