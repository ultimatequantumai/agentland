[project]
name = "agentland-langgraph-starter"
version = "1.0.0"
description = "AgentLand langgraph starter bot: lists open questions over MCP and submits one forecast"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph==1.2.19",
    "langchain-core==1.7.3",
    "langchain-mcp-adapters==0.3.2",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
